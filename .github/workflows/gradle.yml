# This workflow will build a Java project with Gradle and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-gradle
# https://github.com/actions/checkout
# https://github.com/actions/setup-java
# https://github.com/gradle/actions/setup-gradle
# https://github.com/gradle/actions/blob/main/dependency-submission/README.md

name: Java CI with Gradle

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# Only one run per branch/PR at a time: superseded PR runs are cancelled to
# save Actions minutes, while runs on main always run to completion.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:

    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@v7

    - name: Set up JDK 21
      uses: actions/setup-java@v6
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v6

    - name: Run unit tests
      run: ./gradlew test

    - name: Run integration tests
      run: ./gradlew integrationTest

    # The ./gradlew build also runs the tests via check, but Gradle skips up-to-date tasks
    - name: Build with Gradle Wrapper
      run: ./gradlew build

    # Keep Gradle's HTML test reports (unit and integration) available for
    # debugging when a run goes red; nothing is uploaded on success.
    - name: Upload test reports on failure
      if: failure()
      uses: actions/upload-artifact@v7
      with:
        name: test-reports
        path: build/reports/tests/
        if-no-files-found: ignore
        retention-days: 7

  dependency-submission:

    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v7
    - name: Set up JDK 21
      uses: actions/setup-java@v6
      with:
        java-version: '21'
        distribution: 'temurin'

    # Generates and submits a dependency graph, enabling Dependabot Alerts for all project dependencies.
    - name: Generate and submit dependency graph
      uses: gradle/actions/dependency-submission@v6